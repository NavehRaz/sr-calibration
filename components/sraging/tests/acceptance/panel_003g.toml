basin_records = { path = "sr_calibration_tester/reports/basin/scope/records.json", sha256 = "1e7043b64976f8d822439a88326d8d0563459c86d3cce6ef2c98174d1d852d5c" }   # v0.3.3 v1 records the scope scored (v033-points-verify)
ids = { path = "tests/acceptance/panel_003g_ids.tsv", sha256 = "8b82710e7b64e7962bffc789cbbd80c15bdd26b01cce6cce209a6672d08d4c70" }   # written by build

[rules]   # PR-1..PR-6 (spec "Pre-registered rules"); fixed before W1, never changed after a v6 record is read
w_thr = 1.92                      # PR-1: a valid informative cohort with W > w_thr fails its stratum (V)
pr2_loses = "z < -2.0"            # PR-2: the tester's own paired_coverage_gap verdict "loses" (srbench verdict.py)
pr3_margin = 0.10                 # PR-3: p_out - p_in one-sided 95 % lower bound must exceed -pr3_margin (Naveh
                                  # 2026-10-22: 0.10, correcting 0.05, which failed equal coverage at the panel's N)
pr3_alpha = 0.05
pr3_interval = "newcombe-hybrid-score"
pr4_quantities = ["eta", "epsilon"]   # PR-4 (XI): J's intervals narrower than the null's on these
pr4_statistic = "the tester's information axis, its width comparison only (median closed width, WIDTH_TOLERANCE_DEX); its closed-share rule not applied, J's closed share reported (Naveh 2026-10-22, after a v5 dry run: the null is closed on every cohort)"
pr5_measures = { "BASIN-J" = "W33 > w_thr", "BASIN-P15" = "W33 > w_thr", "P-ROUNDOFF" = "W33 > w_thr", "P-DTCEIL" = "cpu_s_v033 > cpu_s_j", "P-CENSORTIE" = "W33 > w_thr" }
pr6 = "blocked iff any PR-1..PR-4 verdict is FAIL or incomplete, or any PR-5 is 'not shown'; empty strata never pass"
g_crit = 1.0                      # FR-011: not_assessed iff g0 == 0 and free-gradient norm > g_crit (leverage_rule)

[verify]   # tasks T031: v033-points-verify reproduces the basin scope's points on its own v1 records (no v6)
points_rows = "BASIN-J's 32 ids (claims path); the 5 smallest-n `recon` rows of scope_cohorts.csv in J's domain; the 2 smallest-n `recon_failed` rows in J's domain (the null twin)"
value_rel_tol = 1e-5              # the kappa rebuild's value against the scope's (recon rows; matched to 1e-12 [M])
point_rel_tol = 1e-12             # claims rows: the recovered point equals the scope's per-parameter points
# Claims rows are gated on the point, not on v0.3.3's value there. A development run (2026-10-22, before this was
# committed) found v0.3.3's value at its own point differs from the scope's WEXAC value by more than 1 nat at 5 of
# the 32 human basin points (up to 3,346 nats): the predecessor's likelihood is host-dependent there, so it is reported as a
# measurement, and W33 is always taken in 1.0.1's likelihood (spec PR-5), never in v0.3.3's.

[seal]   # research R5: v0.3.3's v6 records are read only after jax2's gate run is on record
jax033_v6 = "GATE-V6 registered run 2026-10-27 10:00:07 IST: mle_profile_jax2 1.0.1 PASS (G1-G5); out/GATE_V6.txt sha256 f8c428431bdd337b1cab51325b27e432fa52861fdb5cf75b8b4440685667f7c0; jax2 sesync 20261027-100208-jax2-dccf: the no-peek on runs/jax033-v6-full-bign.json is LIFTED"

[s4]   # FR-009: exactly two sraging fits, each priced before it runs (never from theta-only timers)
fit1 = { cohort = "censor-k0.01-p05-c1-s1", calibrator = "profile_jax2", version = "1.0.1", settings = "default (combinations on, leverage on)", price_cpu_h = "8.6-15 [I]: 19,654 CPU-s full fit without combinations (parity_003b.json) x ITP's 2.6 lead-pair ratio" }
fit2 = { rule = "the human BASIN-J id with basin_fix.fired in W1's record and the lowest record cpu_seconds; priced from that timer before it runs" }
dd_cap_cpu_h = 3.0                # Naveh Dd: the 3 p15 theta-only v0.3.3 fits run only under this total

[windows]   # research R4 (jax2's rev-5 merge plan); HZ-1 (sharp hazard) has no _h record in any window
W1 = { runs = ["jax2-v6-full-bign", "null_prior-v6-full-bign"], witness = "mle_profile_jax2" }
W2 = { runs = ["jax2h-v6-full-bign"], witness = "mle_profile_jax2_h" }
W3 = { runs = ["jax2-v6-sharp-nladder"], witness = "mle_profile_jax2", held = ["pure-k0.0316-p15-c1-s1"], not_stored = ["pure-k0.0316-p15-c1-s1", "pure-k0.0316-p15-c0-s1", "pure-k0.0316-p15-c1-s0"] }   # jax2 sesync 20261028-160206-jax2-960a: 629 of 632; c0-s1 and c1-s0 stopped without a record after repeated preemption; c0-s1 is VALID in SRK-1/outside pure, so PR-1 there reads incomplete
sealed_runs = ["jax033-v6-full-bign"]

# Post-W1 deviations from the registration above (Naveh, spec Clarifications Session 2026-10-28, after the sr-naveh
# interim review). [rules] and [strata] stay as registered; each change is listed here. kind = "verdict": the gate
# reports that stratum's rule as `as`, with the reason (T071). kind = "rule-code": the change is in the named code, a
# reviewed commit in the results test, and the gate copies the entry into its output.
[[deviations]]
id = "DV-1"
kind = "verdict"
stratum = "P-DTCEIL"
rule = "PR-5"
as = "reported"
reason = "a library gap, like E. coli: v0.3.3's step cap delta/(3L) costs more than 1.0.1's floor only below delta/L ~ 4.4e-4 [I]; v6's 16 C. elegans cohorts sit at ~6e-4 [M], so no v6 cohort is in the defect's regime (constitution V deviation)"
decided = "Naveh 2026-10-28"

[[deviations]]
id = "DV-2"
kind = "rule-code"
rule = "PR-2"
code = "sraging.default_gate.coverage_inside"
change = "every axis 'not measured' -> 'reported' (listed under Not Covered), not PASS; a stratum with one measured axis is unchanged"
decided = "Naveh 2026-10-28"

[[deviations]]
id = "DV-3"
kind = "rule-code"
rule = "FR-011"
code = "sraging.leverage.not_assessed, sraging.leverage_rule.G_CRIT_PER_IND"
change = "not_assessed iff g0 == 0 and |g|/n > 5e-5 (n = all individuals), replacing [rules] g_crit = 1.0 on the summed norm, which grows with n"
decided = "Naveh 2026-10-28"

[[deviations]]
id = "DV-4"
kind = "verdict"
stratum = "P-ROUNDOFF"
rule = "PR-5"
as = "reported"
reason = "shown through the basin mechanism only: the 19 shown are human, 15 of them BASIN-J cohorts and 4 more human cohorts with the basin's W33 (270-1,883); on the 112 non-human round-off cohorts v0.3.3 is shown on none (109 not shown, 3 no point; largest W33 -0.034), so the round-off defect itself is not shown on v6 (sr-naveh N7)"
decided = "Naveh 2026-10-29"

[[deviations]]
id = "DV-5"
kind = "rule-code"
rule = "PR-2"
code = "sraging.default_gate.coverage_inside, sraging.default_gate.PR2_N_MIN_LOSES"
change = "a PASS whose measured axes all have fewer than 3 paired cells, where srbench's calibration axis cannot read 'loses' (z < -2.0), reads 'reported' (Not Covered), as DV-2 (sr-naveh N13)"
decided = "Naveh 2026-10-29"

