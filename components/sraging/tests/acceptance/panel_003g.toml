# Spec 003g's frozen gate panel and pre-registered rules (specs/003g-default-switch; data-model "Panel registration").
# Committed with the id list (panel_003g_ids.tsv) BEFORE any v6 record of 1.0.1 or v0.3.3 is read (FR-003). The
# strata counts and ids_sha256 are written by `tools/panel_003g.py build` and checked by `check`.

