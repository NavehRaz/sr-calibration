[amendments]   # of contracts/register-and-panel.md §3 and of the 2026-10-30 decision, before the run (spec.md Clarifications 2026-11-03 (ff794f5))
A0 = "E. coli leaves the clamp family: every E. coli clamp row leaves S4's clamp family and HR-10's clamp tests; it stays in the reflect family ([limits].ecoli_clamp)"
A1 = "HR-6, HR-10, HR-11 at frozen steps (research R18's branch: P1's floor exceeds crit/30): each row runs ONCE at its frozen step, with no per-row ladder; its assessability is its frozen cell's pooled bias, so m <= m_max (2 x the frozen m) is vacuous; HR-11 checks its own bar (1.655 / sqrt(n) / 10); a borrowed row (a step measured on another configuration) reads unassessable when its own coupled D exceeds 3 x its cell's mean per-key D"
A2 = "HR-10: E. coli has no clamp configuration; the clamp path tests that exceed crit at P1's m 64 are judged on reflect only (see [paths].reflect_only); the other clamp tests run at their frozen steps; assessability is the death-time frozen step's pooled bias, and the path bias is reported, not gating"
A3 = "HR-6: G is each family's actual row count, from this file's grid ([s4].G), and crit = kstwobign.isf(0.05 / G) / sqrt(n)"
A4 = "HR-9: the fix arm runs sraging at mice_F hom clamp's frozen step, recorded through the same Delta t grid"
A5 = "HR-7 / gate C5: S5's step bias is the halving difference x 1/(1 - 2^-p), p from S5's p1-pooled cell, reported as an upper bound ((|mean| + 2 SE) x the factor)"
A6 = "HR-7 / S5: S5 runs at m 64 (dt = the frozen m 16's dt / 4); s5-het re-runs P2's 100-cohort coupled halving at that step before its replicates and cites the bias it measures; C2's m_max does not bind S5's step, because S5's step serves the score's bias, not KS's bar; Naveh 2026-11-04 (spec.md Clarifications 2026-11-04)"   # tools/lang_004_fill.py --s5-m 64
A7 = "HR-11 (iii) runs the 4-parameter cell (xc + eta + beta + epsilon at sd 0.2, n 25,000), above the tensor reference's d <= 3 limit (research R28), so it reads \"no FP reference\" and is not clean; the node-budget path (d = 3, a product above 20,000) rests on T104's planted unit test; Naveh 2026-11-04 (spec.md Clarifications 2026-11-04)"   # tools/lang_004_fill.py --a7-text
A8 = "Plants, D-408 (recording): [plants.recording] runs at m = 16, SRK at (Delta t, 16 substeps) as in gate C3 and sraging at Delta t / 16 recorded on delta; at the default m 1 sraging stepped at Delta t and every death fell on the Delta t grid, so the plant could not be informative (plants_004.json at 252ad3a: 0 % off the grid); Naveh 2026-11-04 during the run (spec.md Clarifications 2026-11-04, T121)"   # tools/lang_004_fill.py --a8-text
A9 = "HR-11, after its first run (multi_004.json at 252ad3a, kept as specs/004-samplers/review/evidence/multi_004_first_252ad3a.json): (a) the composite cross-check compares the composite rule with the tensor reference built at bar 1e-4 ([multi].composite.bar, the plants' bar), not at the cells' crit/10, where the reference (M 8 x 5) sits 6.3e-4 from the converged one, inside its own bar; the tensor code agrees with the composite to 1.9e-6 at M 25 x 17; (b) multi re-runs once at fresh keys ([multi].key 60600, from 40600), pre-declared: the first run's one failing cell, xc+eta (D 0.01112 above crit 0.01047), was diagnosed as chance (step bias and the reference ruled out; four fresh draws pass; pooled n 100,000 D 0.0024, p 0.60); both runs are recorded and a fail in the re-run stands; Naveh 2026-11-05 (spec.md Clarifications 2026-11-05, T126)"   # tools/lang_004_fill.py --a9-text

