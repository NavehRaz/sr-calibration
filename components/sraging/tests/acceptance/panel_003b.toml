[ac11]
# The AC11 registration (FR-010.2-3; data-model "The AC11 registration"; tasks T029), committed BEFORE any AC11 fit.
# Naveh, 2026-10-20 (AskUserQuestion, with the recommendation): the small-n null uses all 47 ids ("All 47"); the
# ceilings are "Held-out 0.25, small-n 0.15": each null passes when the Wilson 95 % upper bound of its flag rate
# under the rule's quantities is at or below its ceiling (12 held-out: 0 flags give 0.242, so only 0 passes; 47
# small-n: at most 2 flags, 0.142). The twins and the other quantity sets are reported, not gated; the planted
# detection rate is reported by variant and n. The rule is leverage_rule.RULE, unchanged by Naveh's post-pilot
# decision (T027).
# DISCLOSED: before this registration, 4 development fits priced the panel (scratch, not results): the planted
# k10-p03 point at n 1,000 (twin flat_valley_slide 284 CPU-s; age-0 flag 430; late flag 1,502) and at n 100
# (late flag 255), with seeds 2026102049-50, not the registered ones; and one small-n null member,
# nlad-k0.01-p01-n150-s0 (flat_valley_slide, 246 CPU-s). Price of the whole panel ~11 Mac CPU-h [I].
generator_version = "sraging-gen-1"
rule = {quantities = "all4", ratio = 1.5, delta_total_nats = 1.92, fail_nats = 0.1, refit = "mle_stage_and_warm_start", provisional = false}
# the late plant: one death at factor x the twin's largest age, on the delta grid (an extreme late death)
late_rule = {factor_of_max_age = 1.5}
ceilings = {held_out = 0.25, small_n = 0.15}
detection = {report_by_n = [100, 300, 1000], variants = ["age0", "late"], definition = "flag under the rule, with the planted death the row dropped"}

