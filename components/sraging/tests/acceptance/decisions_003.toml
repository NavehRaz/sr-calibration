# Naveh's decisions that spec 003's acceptance phases read (spec Clarifications; sr-manager gate 3 and 5).
# Each table is written by the main session from Naveh's own answer, with the date he gave it.

[coverage_gate]
# SC-005's gate: the sr-naveh implementation review proposed a non-inferiority margin (a loss is also a paired gap
# whose 95% CI lower end is <= -0.05). Measured first on the committed panel (every cohort a cell, an upper bound):
# per gate test a combination that loses nothing passes 28-95% with it, 97-100% without; 5 points worse passes
# 3-7% with it, 48-84% without.
margin = "none"
decision = "Drop the margin: z < -2 only (the Clarification rule); the CI is printed beside each verdict and the gate's weakness against small losses is a Known limitation. The tester's availability and information axes are reported only, not gating."
date = "2026-10-05"
by = "Naveh (AskUserQuestion: 'Drop it: z < -2 only (Recommended)'; 'Report only (Recommended)')"

[combination_cost]
# Walker step 1 (results/walker_step1_003.json, 20 cohorts, run at 6ceb692): all six combination walks cost a median
# 6.4x the fit's own objective evaluations (4.8x its CPU; range 2.0-10.5x); the lead group (eta/eps, r-bar/eta) 1.8x
# (1.6x CPU), under the Clarification's 2x line. Per combination: eta/eps 0.61, r-bar/eta 0.93, sqrt(eta)/eps 0.77,
# r-bar 1.01, beta/(eta(kappa+1)) 0.82, beta/(1+kappa) 0.93.
default = "lead"
flag = "--combinations all (Python: combinations='all') adds the other four; --no-combinations (False) none"
scored = "all six, in the coverage phase, before any of them ships"
decision = "The lead group on by default, the other four behind a flag; all six truth-scored in coverage (about 250 CPU-h for 215 fits)."
date = "2026-10-06"
by = "Naveh (AskUserQuestion: 'Lead pair on, rest by flag (Recommended)')"

[walker_fix]
# Walker step 1's archive check (results/walker_step1_003.json, run at 6ceb692): 6 of 183 unwidened walk ends have an
# archived point more than 0.01 dex beyond them at deviance < 3.8415. Diagnosed 2026-10-06 (.cache/out/diag, refits):
# r-bar lower (pure-k0.01-p00-c0-s0, jax2_h) stopped at a solver cliff at 0.041 while beta's floor is inside
# (deviance 1.70, 2.52 on a 4x grid); sqrt(eta)/eps lower on three p00 cohorts 1.1-1.2 dex too narrow, the inside set
# on a second branch (beta 10-17, kappa 160-300) the walk never started from (deviance 0.15 at 0.01 dex beyond the
# end; it beats theta-hat by 0.13-0.18 nats); two crossings interpolated short by 0.033 and 0.16 dex. The brute force
# as specified (+-1.5 dex around theta-hat) cannot reach a branch 9-10 dex away in beta: on one of these cohorts all
# 77 starts read outside. The widened claims do not repair it (one still >= 0.035 dex short).
decision = "Fix the walker (beta-floor probe before a lower end of a beta combination is closed, bisect each crossing to 0.01 dex, starts spanning beta's box at each edge, a final pass re-walking any side an archived point contradicts) and the brute force (Sobol starts over the whole beta and kappa box), and re-run walker steps 1 and 2 now; the lead pair's cost is re-measured and comes back to Naveh if it passes 2x."
date = "2026-10-06"
by = "Naveh (AskUserQuestion: 'Fix now, re-run now (Recommended)')"
# Step 1 re-run at 339d113 (results/walker_step1_003.json): 0 of 182 archive checks fail; the lead pair costs 2.30x the
# fit in objective evaluations (median over 20 cohorts; 1.79x before the fixes on the same cohorts; 1.96x in CPU;
# per cohort 0.61-4.25x; median fit 661 CPU-s, lead pair ~1180 CPU-s).
lead_cost_accepted = true
lead_cost_decision = "Accept the lead pair at 2.30x the fit and run walker step 2 (priced on 2 cohorts first)."
lead_cost_date = "2026-10-07"
lead_cost_by = "Naveh (AskUserQuestion: 'Accept 2.3x, run step 2 (Recommended)')"
# The ITP example (examples/data/itp_c2016_het3_control_female.csv, profile_jax2, the default lead pair, at 2306641):
# 7806 CPU-s, 6.3x the fit, outside step 1's 0.61-4.25x. The r-bar/eta lower side crawled: past its end every
# free-kappa solve 0.005 dex out failed (kappa-held slices 0.01 dex past it read deviance 4.52, so the end is right),
# the step hovered above its 1e-4-dex floor, and the side took 24 nodes over 0.0034 dex: 29998 of the walk's 42133
# evaluations. A kappa-corner retry made it costlier (each failed retry 1000-1600 evaluations). Prototyped
# (.cache/out/diag/itp_stall_proto.py): a side past the threshold whose last 3 nodes span < 0.01 dex stops
# "stalled" -- the same claims, 8 nodes and 6898 evaluations on that side, the lead pair 4388 CPU-s (3.4x).
# None of step 1's 240 sides stopped at max_nodes.
stall_stop = true
stall_decision = "Add the stall stop (a side past the threshold whose last 3 nodes span < 0.01 dex stops 'stalled') with a synthetic unit test; re-run walker steps 1 and 2 and the ITP example after the running step 2 finishes."
stall_date = "2026-10-08"
stall_by = "Naveh (AskUserQuestion: 'Stall stop, re-run (Recommended)')"
# Walker step 2 at b1220c9 (on step 1 at 339d113): 176 of 182 ends pass; every outward check and all 182 archive
# checks pass. The 6 failures are the inward checks on the 3 intervals narrower than 0.05 dex (realfull Denmark_M_1900
# eta/eps 0.017 dex wide and sqrt(eta)/eps 0.016; pure-k0.01-p08-c1-s1 eta/eps 0.033), where the point 0.05 dex
# inward lies beyond the other end (brute-force deviance 84-114 and 14.5-22.5 there, as a quadratic profile gives).
inward_cap = "argmax"
inward_decision = "The inward point moves min(0.05 dex, the distance from the end to the profile's maximum): an inside point within 0.05 dex inward is what SC-004 asks ('no end more than 0.05 dex wider'). In effect from the step 2 re-run."
inward_date = "2026-10-08"
inward_by = "Naveh (AskUserQuestion: 'Cap at the argmax (Recommended)')"

[coverage_library]
# The tester's main (997b94e, 2026-10-08) has library v5, which corrects the first recording bin (a first-bin death
# was written at delta/2; v5 records it at 0): 564 of v2's cohorts change arrays, 24 (ecoli) are gone; no store has
