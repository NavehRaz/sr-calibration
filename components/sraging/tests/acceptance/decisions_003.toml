# 85, censor 16 of 55, hazard 5 of 55 -- each below the spec's 50-informative-cohort floor.
gate_on = "all"
decision = "The gate runs on all 215 cohorts as specified (it is paired: an invalid truth affects a combination's claims and the same fits' eta and eps claims alike). Beside each verdict, the absolute coverage is also reported on the validity-valid cohorts only."
date = "2026-10-08"
by = "Naveh (AskUserQuestion: 'Keep all, report valid (Recommended)')"

[coverage_host]
# SC-005 said "Mac fits with the port" (2026-10-05). The coverage run (215 fits with all six walks, about 310-380
# CPU-h, 31-38 h wall on this Mac's 10 workers) moves to the WEXAC cluster to free the Mac (step 2, speed, unchanged)
# and save about a day. The paired gate compares claims within one fit, so the host does not bias it; but the jax2
# session measured that 1.0.0's claims differ across hosts (17 of 17 A/B cohorts), so the result describes cluster
# fits and says so. A Mac subset of 15 cohorts (5 each of pure, censor, hazard), fitted at the same commit, is
# compared row by row (shape differences, end shifts in dex, hit flips): reported, not gated (about 21-26 CPU-h).
host = "wexac"
mac_subset = 15
decision = "Run the coverage fits on WEXAC (Python 3.14 env with the pinned packages, sraging at the run commit, a shard runner writing one row per fit with its host); score them locally at the same commit; fit 15 cohorts (5 per gated arm) on the Mac as a cross-host check, reported not gated. Nothing is submitted before walker step 2 passes and Naveh says yes to the launch."
date = "2026-10-08"
by = "Naveh (AskUserQuestion: 'Cluster + Mac subset (Recommended)')"
# The smoke job (LSF 551868, at e7c7884; censor-k0.01-p00-c0-s0, profile_jax2, all six walks): done, 21789 CPU-s
# (6.1 h), 731 MB peak, on cn430, an Intel Xeon Gold 5320 at 2.2 GHz. 87542 combination evaluations, near the walker
# panel's Mac median (64053), but 0.221 CPU-s each against the Mac's median 0.064 (range 0.038-0.148): about 3.5x
# slower per evaluation on that node, so the coverage run is roughly 1100-1300 CPU-h there and the slowest fits could
# near short's 1440-min limit. The row imported at its own HEAD and was refused at another. WEXAC's hosts are 214
# Intel and 151 AMD_EPYC (lshosts model; several EPYC generations share the label).
queue = "long"
cpu_model = "AMD_EPYC"
queue_decision = "Submit the coverage array to queue long (RUNLIMIT 10080 min) and only to AMD_EPYC hosts (select[model==AMD_EPYC]), so every scored fit ran on one CPU family; first one more smoke job, the same cohort on an EPYC host, to measure its speed and compare its claims with the Intel row (row discarded)."
queue_date = "2026-10-09"
queue_by = "Naveh (AskUserQuestion: 'long, 7-day cap (Recommended)', 'AMD EPYC only (Recommended)', 'Yes, one EPYC smoke (Recommended)')"
# The EPYC smoke (LSF 606338, at e24eb9b; no fitting-code change since e7c7884): done on cn127, an AMD EPYC 9634,
# 18392 CPU-s (5.1 h), 816 MB peak; 0.188 CPU-s per combination evaluation (Intel 0.221). The same 87542
# evaluations, the same gap (0.27475 nats) and all 10 claims (4 parameters, 6 combinations) bit-identical to the
# Intel row: on this cohort the two x86 families agree exactly. At about 2.9x the Mac's CPU per evaluation, the
# coverage run is roughly 900-1100 CPU-h on EPYC.
# Walker step 2 passed at 01799ed (results/walker_003.json, committed f4b151c): 182/182 ends.
launch = true
launch_decision = "Submit the 215-fit coverage array to WEXAC (queue long, AMD_EPYC, 4096 MB) at the commit that records this, and start the 15-cohort Mac cross-check beside it in a worktree at the same commit; score when the rows are back."
launch_date = "2026-10-09"
launch_by = "Naveh (AskUserQuestion: 'Launch now (Recommended)')"

[coverage_result]
# The coverage phase at d903979 (results/coverage_003.json, committed 4992bb2): status fail. The 215 WEXAC fits (LSF
# 623316; AMD EPYC 7702 145, 9634 70; 646 CPU-h, all ok) were imported and scored on this Mac at that commit. Two
# losses, both profile_jax2|censor eta_over_eps: vs eta z -2.70 (35 cells, 14 clusters), vs eps z -2.74 (38 cells,
# 13 clusters). Its closed coverage is 36/44 (0.818, Wilson 0.68-0.90), its median width 0.25 dex against eta's 0.87,
# and every miss has the truth above the upper end. On the tester's validity-valid cohorts it covers 14/15; on its
# cv_bias cohorts 22/29, falling with the flag's statistic 2n(dlnCV)^2: 14/15 below 0.1, 11/13 in 0.1-1, 6/7 in 1-10,
# 5/9 above 10. The tester's generator over-spreads lifespans (reports/validity/SUMMARY.md), which pulls eta/eps
# down; the narrow eta/eps interval shows it where the wider eta and eps intervals do not, so [coverage_validity]'s
# "alike" does not hold for the narrowest combination. No library version through v5 changes the generator (by
# commit title). 23 of the 36 gaps are underpowered (< 30 paired closed cells or < 10 clusters: r-bar,
# beta/(1+kappa), beta/(eta(kappa+1)) and, on censor and hazard, r-bar/eta are mostly one-sided); the pre-fit power
# counted every informative cohort as a cell. 11 gaps pass, both lead combinations on pure among them.
# Cross-host (results/coverage_xhost_003.json, reported): 15 pairs, 0 hit flips in any quantity, 4 combination shape
# changes; the cluster rows were 8 on the 7702 and 7 on the 9634.
status = "fail"
head = "d903979764194c5b7afa7b048710210c15e9179b"
losses = [["profile_jax2|censor", "eta_over_eps", "vs_eta"], ["profile_jax2|censor", "eta_over_eps", "vs_epsilon"]]
n_underpowered = 23
decision = "Record SC-005 as failed, as the rule says, attributed to the panel generator's CV bias (the tester's validity flag, fixed before any coverage was looked at), with the dose-response and the valid-only coverage in the docs and README. The re-test on a panel without the bias goes to the next spec; it needs a corrected generator. Spec 003 closes with SC-005 failed and explained, if the sr-manager accepts it at T050."
order = "unchanged"
order_decision = "Keep the frozen order (SC-008, measured before coverage): eta/eps stays first. The docs note that eta/eps, the combination most sensitive to the lifespan CV, is where a model-data CV mismatch shows first."
# The option's "most sensitive to the lifespan CV" is not measured; the docs say only what is: eta/eps's intervals
# are the narrowest, and its misses track the generator's CV bias.
date = "2026-10-10"
by = "Naveh (AskUserQuestion: 'Record fail, attributed (Recommended)'; 'Keep the frozen order (Recommended)')"

[speed_load]
# SC-010's busy rule was "refuse to start above a 1-minute load of 1.0, not applicable if a later sample exceeds 2.0"
# (the sr-manager's run order, gate 7, 2026-10-05). Measured on this Mac (M5 Pro: 5 Super + 10 Performance cores) on
# 2026-10-10, with BTLEServer and Finder stopped: one-minute loads 1.54, 1.97, 4.22, 3.10, 2.89, 2.50, 7.10, 3.98 at
# 19:30-19:37 while top showed the CPU 87-92 % idle (all other processes together about 1.2 cores) and the disk
# under 1 MB/s outside one 40-60 MB/s burst: the load counts briefly runnable threads, not contention. Spec 002's
# speed phase used max_load 5.0 (panel_002_speed.toml) and passed starting at 3.34. The ratio is paired and the order
# alternates, so background load widens the CI (harder to meet the 1.03 upper limit), it does not make a pass.
load_max = 5.0
own_load = 1.0
was = 1.0
decision = "Use spec 002's bar for SC-010: refuse to start above a 1-minute load of 5.0; not applicable if any later sample exceeds 6.0 (5.0 plus this run's own process). Decided before the speed run, with no speed result seen."
date = "2026-10-10"
by = "Naveh (AskUserQuestion: 'Spec 002's bar: 5 (Recommended)')"

[close]
# The sr-manager's closing gate (T050, review/sr-manager_close.md): CLOSE WITH CONDITIONS, SC-005 accepted as failed
# and attributed, the speed bar accepted; four documentation conditions, applied. It put two choices to Naveh and
# one clean-up. The attribution is a supported hypothesis: the direction is measured (on censor the eta/eps point lies
# below the truth in 79 % of flagged fits, 47 % of valid ones); coverage alone separates weakly (Fisher p 0.23 on
# censor, 0.14 pooled). 6 of the 8 censor misses lie within 0.01 dex of the end, and the walker was never
# brute-force checked on censored data.
eta_eps_default = "unchanged"
eta_eps_decision = "Keep eta/eps on by default on censored cohorts; the README and the docs warn (undercovered on censored test data, attributed to the generator's CV bias, supported not proven). No change to any fit."
retest = "walker_check_first"
retest_decision = "The next spec first checks the 8 censor misses' eta/eps upper ends by brute force (the manager's estimate 2-10 CPU-h, unmeasured); then re-tests only eta/eps, rbar/eta and sqrt(eta)/eps on censor and hazard, on a corrected generator. Not a repeat of the 215 fits: beta/(eta(kappa+1)) has 0 closed, not box-limited claims on censor and hazard and 3 on pure."
worktrees = "removed"
date = "2026-10-10"
by = "Naveh (AskUserQuestion: 'Keep default, warn in README (Recommended)'; 'Walker check first (Recommended)'; 'Remove both (Recommended)')"
