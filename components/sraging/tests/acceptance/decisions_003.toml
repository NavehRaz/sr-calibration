# 160 cohorts and all 55 of profile_jax2_h's change in v5 (docs/planning/handoff_2026-10-08_decisions.md). The gate
# is paired (method vs method on the same cohorts), which the tester says v2 keeps like-for-like. Priced from walker
# step 1 at 339d113: about 310-380 CPU-h for 215 fits with all six walks, about 31-38 h wall on 10 workers.
library = "v2"
decision = "Run spec 003's coverage phase on library v2 now, on 003's current pins, all six combinations, after the walker re-runs. The move to v5 is a new spec after 003 closes, and repeats coverage there."
date = "2026-10-08"
by = "Naveh (AskUserQuestion: 'On v2 now (Recommended)'; 'New spec after 003 (Recommended)')"

[coverage_validity]
# The tester's reports/validity/validity.csv (the file the kmax panel already reads) flags 125 of the 215 coverage
# cohorts invalid: profile_jax2 75 of 160 (cv_bias 69, cv_bias+zero_mass_death 6; all 36 cv-sharp cohorts among
