# Spec 003f's panel: the leverage check's rule and P3's cohorts (specs/003f-leverage-check/).
#
# [rule] must equal sraging.leverage_rule.RULE (tools/acceptance_003f.py checks it before any phase). Decided by
# Naveh on 2026-10-18 after P3 (task T014; spec FR-006, gate C7) and revised on 2026-10-19 after the sr-naveh review
# and an offline re-score of P3's drops (specs/003f-leverage-check/review/): all four flag quantities, 1.92 nats in
# total, a refit ending below theta-hat labelled failed, the warm start against the reported theta-hat. P3 re-runs.

[rule]
quantities = "all4"            # "all4" (eta/eps, rbar/eta, eta, eps), "lead_pair" or "raw"; Naveh, 2026-10-19
ratio = 1.5                    # sec13 eq. lev-ratio: R_j > ratio
delta_total_nats = 1.92        # the refit's gain on the reduced objective, total nats; at or below it, flat_valley_slide
fail_nats = 0.1                # a refit ending more than this below theta-hat on its own objective is failed
refit = "mle_stage_and_warm_start"   # the MLE stage and L-BFGS-B from the reported theta-hat; the better, vs theta-hat
provisional = false

[gate]
# SC-003 is REPORTED (Naveh, 2026-10-19): its ceiling was set after P3 and P3 shaped the rule again; the held-out and
# small-n nulls run in 003b AC11. The ceiling is kept for the record of the 2026-10-18 decision, not as a gate.
false_flag_ceiling = 0.15
# SC-004: the production check's overhead p90 as a share of the fit (the gate's M2)
overhead_p90_ceiling = 0.35

[p3]
rule = """the gate's C8: in v6 library order, 10 human ids from the 45 basin ids (TESTER/reports/basin/scope/
label_final.csv, fail_mle, E. coli dropped) with no basin_fix history in jax2-v5-full-bign, 3 with it, 5 main pure
at n 1,000, 5 main censor; plus every v6 cohort with exactly one age-0 death whose term at the truth is below all its
other terms; sharp cohorts excluded"""
human_no_basin_fix = ["hazard-real-Sweden_F_1910_hetro-c1-s0", "hazard-real-Sweden_F_1910_hetro-c1-s1", "censor-real-Denmark_M_1900_hetro-c1-s0", "censor-real-Denmark_M_1890_hetro-c1-s0", "hazard-real-Denmark_F_1900_hetro-c1-s1", "hazard-real-combined_human_F-c1-s1", "pure-real-Sweden_F_1910_homo-c1-s0", "pure-real-Denmark_M_1900_hetro-c1-s1", "pure-real-Denmark_M_1890_hetro-c1-s1", "pure-real-Denmark_F_1900_hetro-c1-s0"]
human_basin_fix = ["hazard-real-combined_human_F-c1-s0", "hazard-real-Sweden_M_1910_hetro-c0-s0", "hazard-real-Sweden_F_1910_hetro-c0-s0"]
