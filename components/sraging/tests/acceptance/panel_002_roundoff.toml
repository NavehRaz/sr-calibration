# The round-off panel (spec 002 SC-007; research R15). COMMIT before `mpref` (it refuses an uncommitted panel).
# Each case is evaluated in full by the engine ("v1" and "v033") and by tests/reference/mp_scheme.py on the same
# grid (the cohort's v033 grid); "v1" must be within 1e-5 nats of mpmath per evaluation, and the +-3-ulp scan of
# theta must move "v1" by at most 1e-5 nats (v033's spread is reported).
library = "v1"
tester_head = "dbe504a91a34ffe6656f5a662e1a33a6cbecba09"
dps = 60
selection = """R15: Sweden_F_1910 at its stored theta-hat (mpmath stored: tests/reference/data/t7_mpref.json);
Denmark_F_1900 hetro (v0.3.3 -700 versus about -31.5) at spec 001's six frozen theta points; the two
censor-arm Denmark cohorts with the most round-off deaths in the tester's
reports/basin/likelihood_fix/v2/final_tables.md (column 'fired': c-Denmark_M_1890_hetro-c0-s1 19,
c-Denmark_F_1890_hetro-c0-s1 17) at their truth and at the table's frozen-variant theta (3 significant
figures, as printed); one exact-time cohort (hazard-k0.01-p00-c0-s0, its ages read as exact, with its external
hazard), at its truth."""

[[case]]
cohort = "pure-real-Sweden_F_1910_homo-c0-s0"
theta = "stored"            # rho and L from t7_mpref.json (key 'pure-real-Sweden_F_1910_homo-c0-s0|stored')

[[case]]
cohort = "pure-real-Denmark_F_1900_hetro-c0-s0"
theta = "panel_v1"          # the six frozen points of tests/acceptance/panel_v1.toml

[[case]]
cohort = "censor-real-Denmark_M_1890_hetro-c0-s1"
theta = "truth"
[[case]]
cohort = "censor-real-Denmark_M_1890_hetro-c0-s1"
theta = { eta = 1.47e-08, beta = 0.000195, epsilon = 1.58e-05, kappa = 0.00274 }
theta_label = "final_tables frozen"

[[case]]
cohort = "censor-real-Denmark_F_1890_hetro-c0-s1"
theta = "truth"
[[case]]
cohort = "censor-real-Denmark_F_1890_hetro-c0-s1"
theta = { eta = 1.08e-08, beta = 0.000228, epsilon = 1.07e-05, kappa = 0.238 }
theta_label = "final_tables frozen"

[[case]]
cohort = "hazard-k0.01-p00-c0-s0"
theta = "truth"
exact = true                # ages read as exact times (continuous); register D-106

[[case]]
# added 2026-10-04 after t1 at 89530e9: on this cohort (n = 93,893, its window, K ~ 5e5-7e5) the like-for-like
# v033 total differs from SRK's by up to 1.03e-4 nats at T1's beta x1.5 and epsilon x1.5 points (both are S-route
# round-off); mpmath judges v1 on all five points
cohort = "realfull-real-Sweden_F_1910_homo-c0-s1"
theta = "t1_labels"
window = true

# -- the `early` phase (research R12, amended at review T064): early-death terms (S_obs(t) > 1 - 1e-3 at the
# evaluation theta) at the v033 grid against a converged reference: a graded start (dtau_0 = 1e-10, ratio
# 1.005) then uniform dtau = delta/(10 L), at N = 1800, 3600, 7200 extrapolated in N at the observed order;
# accepted as converged when halving the uniform step moves a term by < 1e-4 nats and the N = 3600/7200 pair
# by < 1e-3 nats. The residuals go into D-004 whatever their size.
[[early]]
cohort = "censor-real-Denmark_M_1890_homo-c0-s0"
theta = "stored_fit"         # the stored v0.3.3 record's claim points (rc2 I3: 5.68 nats at production)
[[early]]
cohort = "pure-k0.1-p22-c1-s1"
theta = "stored_fit"         # rc2 I3: 3.10 nats
[[early]]
cohort = "pure-real-Sweden_F_1910_homo-c0-s0"
theta = "stored"             # t7_mpref.json
[[early]]
cohort = "itp_plus_age0"     # tests/data/itp_plus_age0.csv, delta 1 day, at the ITP example's theta-hat
theta = "itp_example"
