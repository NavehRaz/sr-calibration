[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sraging"
version = "0.1.0"
description = "The SR (saturating-removal) ageing model: Fokker-Planck/JAX fitting of survival data."
readme = "README.md"
requires-python = "==3.14.*"
# Exact pins: byte identity with the v0.3.3 oracle needs the same wheels
# (tests/oracle/v033/pip_freeze.txt; research R5).
dependencies = [
    "numpy==2.4.3",
    "scipy==1.17.1",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "ml_dtypes==0.6.0",
    "opt_einsum==3.4.0",
]

[project.optional-dependencies]
# Spec 004 FR-014: sraging's Langevin engine (sraging.langevin) and nothing else; the FP path never imports numba.
# The versions are the oracle's (tests/oracle/v033/pip_freeze.txt:86).
langevin = ["numba==0.64.0", "llvmlite==0.46.0"]
# Spec 005 FR-018, R7: sraging.plots and nothing else; the version is the oracle group's (below).
plots = ["matplotlib==3.10.8"]

[project.scripts]
sraging = "sraging.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "iniconfig==2.3.0",
    "packaging==26.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "jsonschema==4.26.0",
    "attrs==25.4.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
]
# The third-party import closure of the frozen oracle in tests/oracle/v033, at its pip_freeze.txt
# versions (filled by T004). Used only by the parity tests and tools/acceptance.py.
oracle = [
    "autograd-gamma==0.5.0",
    "autograd==1.8.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "emcee==3.1.6",
    "fonttools==4.62.0",
    "formulaic==1.2.1",
    "interface-meta==1.3.0",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "lifelines==0.30.3",
    "llvmlite==0.46.0",
    "matplotlib==3.10.8",
    "mpmath==1.3.0",
    "narwhals==2.18.0",
    "numba==0.64.0",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "plotly==6.6.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "seaborn==0.13.2",
    "six==1.17.0",
    "tqdm==4.67.3",
    "typing_extensions==4.15.0",
    "tzdata==2025.3",
    "wrapt==2.1.2",
]

[tool.hatch.build.targets.wheel]
# Every tracked file under src/sraging ships, package data included: generator_point_table.json, claims/*.json and
# (spec 005 R9) data/presets_legacy/*, SRK's three summery_*.csv with their MANIFEST.json.
packages = ["src/sraging"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/parity", "tests/acceptance"]
markers = [
    "parity: side-by-side comparison with the frozen v0.3.3 oracle (needs the pinned env on this host)",
    "slow: runs full calibrations; opt-in with -m slow",
    "engine: the generalised FP engine (spec 002)",
]
addopts = "-m 'not slow'"
