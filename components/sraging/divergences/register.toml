[[divergence]]
id = "D-018"
title = "Theta-hat on an upper box edge: the fit ran up a ridge and its intervals sit too high"
tag = "ESTIMATOR/CONVENTION"
status = "diverged"
legacy = "box eta, beta, epsilon <= 1e3, kappa <= kappa_max (estimator.box_for); when the likelihood keeps rising out of the box along the ridge of D-020, the MLE stops on the edge and the profiles are taken around that point; the verdict is identified and the label says two-sided 95% profile-likelihood interval. The true eta then lies BELOW the interval: the box does not touch the lower end, the whole interval sits up the ridge"
new = "numbers identical (ported as-is); sraging adds the truth-free BOX_EDGE warning (FR-017b, theta-hat within 0.1 % of an upper edge). Scored on the 1990 stored v0.3.3 records it fires on at least 215 (records whose none claims hide theta-hat cannot be scored); a closed eta interval covers the true eta in 8 of 214 of them. A quiet BOX_EDGE does not make intervals right: on scorable quiet records closed eta covers in 66 of 248 (review/measurements.json, box_edge_rule_rtol_1e-3)"
source = "found on the first README example (Drosophila, review/evidence/drosophila/, tools/example_ridge.py); sr-naveh review B1; related to D-009 (raw-beta bounds set by kappa_max)"
impact = "in 147 stored records with beta on the 1e3 edge and a closed eta claim, the true eta lies below the interval in 143 and above it in 0; such intervals must not be used"
downstream = ["spec 003: the 'open above: box-limited' claim shape"]
regression_test = "tests/unit/test_asis_defects.py::test_d018_closed_interval_ends_at_the_beta_box_edge"

