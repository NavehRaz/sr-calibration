[[divergence]]
id = "D-004"
title = "Interval-mass cancellation: S(t) - S(t+delta) underflows to exactly 0 when S ~ 1"
tag = "CODE"
status = "diverged"
legacy = "p_phys = clip(S_i - S_hi, 0, None), floored at -700: head deaths score -700 or about -31..-37 nats depending only on rounding (numerics 'v033', unchanged)"
new = "numerics 'v1' (the engine's default, spec 002): a death's mass is F(t+delta) - F(t) wherever F(t+delta) < S(t), F the absorbed mass carried by the march from the scheme's own discrete mass balance plus the clip's mass ([T-JAX-BASIN] fix B); with an external hazard the mass is e^{-H(t)} [m + S(t+delta)(-expm1(-h delta))], free of cancellation. Where F(t+delta) >= S(t) the mass is v033's own expression, bit for bit. Besides the cancellation it removes the S route's stiffness error: S's mass is the tridiagonal solve's residual away from the true difference, about (0.1-0.5) u rho_eps dtau N^2 (review T064 N2; mpmath at N = 300: F's median relative error 1.4e-10, S's 1.5e-7), which moves resolved terms by +4.8e-4 nats in total at Denmark_F_1900's truth and +3.0e-5 at Sweden's (sr-naveh's measurement). It does NOT remove the grid's discretisation error: a rescued early-death term can still be far from the converged value (the ITP age-0 death: -36.8 on the fit's grid, -114.0 converged), measured in spec 002 (residual below). profile_v033 keeps numerics 'v033'"
source = "SR_algorithms.pdf Appendix A R1; OPEN_TASKS [T-JAX-BASIN] root cause 2 and fix B; tester reports/basin/likelihood_fix/v2 (t7_mpref.json: patched - exact 2.33e-10 vs frozen +83.25 nats at Sweden's stored point); jax2 fp_jax.py:207-228, 657-666 at 0ab67c0 (read-only reference)"
downstream = ["spec 002: FLOORED_DEATHS (per-individual terms; decision 2026-10-03)", "spec 006: impact on theta-hat and claim shapes (constitution VII) is measured there (moved from spec 003 by Naveh's decision of 2026-10-05: no spec 003 calibrator uses the engine's numerics)"]
regression_test = "tests/unit/engine/test_default_vs_v033.py::test_guard_passes_and_names_terms"

[divergence.condition]
applies_to = ["v1"]
terms = "death & interval & use_F"
value_bound = "mass_stiffness"
gradient_bound = "uncovered terms: the weighted gradient agrees to 1e-10 relative (guard.GRAD_RTOL); covered terms both numerics resolve (|dl| <= 1e-8): to 1e-6 relative (guard.GRAD_COVERED_RTOL); rescued terms: v1's weighted gradient agrees with central differences of v1 (guard.CD_STEPS)"
c_stiff = 1.8996
floor_ulps = 348.2
demonstrated_resolution = "the guard caught every planted change down to 1e-12 relative (results/guard_002.json); uncovered terms are held to 4 ulps x (1 + (S_lo + S_hi)/m), the compiler's rounding amplified by the difference that forms a death's mass, so a smaller change on a cancelling term can pass unseen"
c_source = "tests/acceptance/results/guard_pilot_002.json: c = 4 x 0.4749 (the worst |dm|/(u K) at the stiff points, Denmark_F_1900 hetro truth at N = 450, dtau = 1e-3); floor = 4 x 87.1 u (the worst excess over 0.4749 u K, pure-k0.01-p02-c0-s1 kmax). Frozen from the acceptance run at 030f5bb (clean tree; 11 stiff and 39 ordinary points), 2026-10-04"

[divergence.impact]
panel = "tests/acceptance/panel_002_roundoff.toml"
strata = ["[T-JAX-BASIN] round-off cohorts", "ITP example + an age-0 death (D-105)"]
measured_here = "Sweden_F_1910 at its stored theta-hat: v033 -455513.2736039060, v1 -455596.5252974534; mpmath at 60 digits -455596.52529745025 (tests/reference/data/t7_mpref.json, remeasured_here; the stored 40-digit value is itself 3.4e-9 off): v1 - exact -3.1e-9, v033 - exact +83.25 nats"
dloglik_total = { per_cohort = "results/mpref_002.json#dloglik" }
residual_vs_converged = { per_term = "results/early_002.json#residual" }
mpref_measured = "results/mpref_002.json (f08192c): on the routed F-route terms of 108 T1 evaluations v1 is within 7.4e-6 nats of 60-digit mpmath, v033 up to 209 nats off; on the round-off panel v1 matches at every fitted or stored theta (Denmark_F_1900 hetro optimum +1.7e-7 vs v033 +46.05; censor Denmark_F_1890 frozen +3.2e-7 vs v033 -3316); at the human cohorts' stiff truths (K up to ~8e6) both numerics are 9e-5..3e-4 nats off, and on the n = 93,893 Swedish cohort v1 misses at eta x1.5 (+-3-ulp spread 1.7e-5) and epsilon x1.5 (2.4e-5 off): float64 conditioning of the solve, not this entry (recorded limitation, Naveh 2026-10-04; 12 of 17 round-off evaluations meet 1e-5)"
early_residuals = "results/early_002.json (f08192c): the time grid's own error on early-death terms (S_obs > 1 - 1e-3) at the v033 grid, v1 minus a converged graded-start reference: censor-real-Denmark_M_1890_homo-c0-s0 at its stored fit -12.3 nats over 281 terms (max 0.07); pure-k0.1-p22-c1-s1 +3.19 over 10 (max 0.32); pure-real-Sweden_F_1910_homo-c0-s0 at its stored theta-hat +190 over 1,027 (max 134); the ITP example + an age-0 death +75.4 (that death). 9 references miss the convergence tolerance (accepted with their uncertainty, Naveh 2026-10-04): 4 with masses < 1e-30 moving by up to 3.5 nats (Sweden rows 1-3, the ITP age-0 death), 5 with masses 1e-21..2e-14 whose halving moves of 1.2e-4..2.2e-3 nats are just above the 1e-4 tolerance (Sweden rows 4-8). D-004 removes the round-off; this residual remains, and a graded default mesh is spec 003's decision"
dtheta_dex = "not measured in spec 002 (no fits); spec 006"
claim_shape_changes = "not measured in spec 002; spec 006"

