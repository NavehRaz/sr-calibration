# The divergence register (constitution VII; spec FR-025; contracts/divergence-register.md).
#
# Every difference between sraging and the v0.3.3 reference, and every known defect of the ported code
# path that is deliberately kept ("ported-as-is"), with the test that pins it. Read by
# `sraging.divergences.load()`; checked by tests/unit/test_register.py.
#
# tag:    MODEL | ESTIMATOR/CONVENTION | CODE
# status: ported-as-is | diverged | refused-input
# impact: "none: not fixed" for ported-as-is entries; a measured table (VII) for `diverged` ones.

[[divergence]]
id = "D-001"
title = "The curve-fit seed caps rho at 300, so large sharp (human) cohorts are seeded far from the truth"
tag = "CODE"
status = "ported-as-is"
legacy = "fp_curvefit.RHO_CEIL = 300.0; the shared seed lands at rho_eta ~3.5-5 on every human cohort against truths of 1e3-1e5"
new = "identical (ported as-is); the resulting wrong fits are flagged by BASIN_GAIN / BASIN_OUTSIDE"
source = "OPEN_TASKS [T-JAX-BASIN] root cause 1 (SRK/fp_curvefit.py:290)"
impact = "none: not fixed"
downstream = ["every v0.3.3 fit of a large human life table"]
regression_test = "tests/unit/test_asis_defects.py::test_d001_seed_rho_cap"

